# Overrides for the shared VPS. Use together with compose.yaml:
#   docker compose -p mamoni -f compose.yaml -f compose.vps.yaml ...
# Everything is bound to the loopback interface so only the Cloudflare Tunnel can reach it,
# and memory is capped so this stack cannot starve the other sites on the server.
name: mamoni
services:
  web:
    ports: !override ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"]
    restart: unless-stopped
    mem_limit: 128m
  app:
    restart: unless-stopped
    mem_limit: 512m
  worker:
    restart: unless-stopped
    mem_limit: 256m
  scheduler:
    restart: unless-stopped
    mem_limit: 128m
  postgres:
    restart: unless-stopped
    mem_limit: 512m
  redis:
    restart: unless-stopped
    mem_limit: 192m
  mailpit:
    ports: !override ["127.0.0.1:8026:8025"]
    restart: unless-stopped
    mem_limit: 64m
