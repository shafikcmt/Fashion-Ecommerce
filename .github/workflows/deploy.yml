name: Deploy to VPS

# Deploys only after the "Commerce checks" workflow succeeded on main (or when started by hand).
# Runs on the self-hosted runner labelled "mamoni" on the VPS. Keep this repository private:
# a self-hosted runner must never execute code from untrusted pull requests.
on:
  workflow_run:
    workflows: ["Commerce checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mamoni
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, mamoni]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy
        run: bash deploy/deploy.sh
