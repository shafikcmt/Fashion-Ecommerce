name: Commerce checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fashion_test
          POSTGRES_USER: fashion
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fashion"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: fashion_test
      DB_USERNAME: fashion
      DB_PASSWORD: test-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: predis
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, intl, gd, zip, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php vendor/bin/pint --test
      - run: php vendor/bin/phpunit
      - run: npm ci
      - run: npm run build
      - run: php artisan view:cache
      - run: php artisan route:cache
      - name: Verify Redis connection
        run: php artisan commerce:check-redis
      - name: Prepare public media storage for browser checks
        run: php artisan storage:link
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          APP_ENV: local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
