# Behind a TLS-terminating proxy (Cloudflare Tunnel): honour the forwarded scheme and visitor IP.
map $http_x_forwarded_proto $fastcgi_https { default off; https on; }
map $http_cf_connecting_ip $client_ip { default $remote_addr; "~." $http_cf_connecting_ip; }
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 6M;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    location ^~ /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* ^/(demo|images)/.*\.(svg|png|jpe?g|webp)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param REMOTE_ADDR $client_ip;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
